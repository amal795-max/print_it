        - id
        - orderId
        - status
        - amountMinor
        - currency
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - SUCCEEDED
            - FAILED
        amountMinor:
          type: integer
          minimum: 0
        currency:
          type: string
          enum:
            - SYP
          example: SYP
          description: 'عملة واحدة: الليرة السورية الجديدة (SYP). المبالغ في أصغر وحدة؛ 100 قرش = 1 ليرة.'
        failureReason:
          type: string
          nullable: true
          description: 'For a simulated failure: SIMULATED_FAILURE. Out-of-stock at payment is reported as HTTP 409 and does
            not create an attempt.'
        createdAt:
          type: string
          format: date-time
    MockPaymentInput:
      type: object
      required:
        - testScenario
      additionalProperties: false
      properties:
        testScenario:
          type: string
          enum:
            - SUCCESS
            - FAILURE
          description: Demo-only control. SUCCESS can still return HTTP 409 if inventory is insufficient; no real 
            charge.
    PaymentAttemptResult:
      type: object
      required:
        - attempt
        - order
      properties:
        attempt:
          $ref: '#/components/schemas/PaymentAttempt'
        order:
          $ref: '#/components/schemas/Order'
    OrderStatusHistory:
      type: object
      required:
        - id
        - orderId
        - toStatus
        - changedAt
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        fromStatus:
          type: string
          nullable: true
        toStatus:
          type: string
          enum:
            - PENDING_PAYMENT
            - CONFIRMED
            - IN_PROGRESS
            - READY_FOR_DELIVERY
            - SHIPPED
            - DELIVERED
            - CANCELLED
        changedByUserId:
          type: string
          format: uuid
          nullable: true
        changedAt:
          type: string
          format: date-time
    OrderItemReview:
