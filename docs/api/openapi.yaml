components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie placeholder name session based on teammate Postman. Actual Set-Cookie/CORS/CSRF
        behavior must be confirmed from running NestJS; do not assume production config.
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token returned by GET /auth/csrf-token; send on POST, PATCH, DELETE requests (including
        OTP endpoints). Session cookie must be included.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Random UUID-like key per logical checkout/payment operation. Retry using same key and same body.
        Scope: customer+order creation, or order+payment attempt.'
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    User:
      type: object
      required:
      - id
      - fullName
      - email
      - phone
      - role
      - isVerified
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: سارة أحمد
          description: الاسم الكامل باللغة العربية (محتوى المستخدم كما أدخله).
        email:
          type: string
          format: email
          example: rana@example.com
        phone:
          type: string
          minLength: 7
          maxLength: 20
          example: '+963912345678'
          description: رقم تواصل العميل. يجب التحقق من الصيغة والتطبيع في السيرفر.
        role:
          type: string
          enum:
          - CUSTOMER
          - ADMIN
          readOnly: true
        isVerified:
          type: boolean
          description: هل تم تفعيل البريد عبر OTP؟
        createdAt:
          type: string
          format: date-time
    AuthCredentials:
      type: object
      required:
      - email
      - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    RegisterInput:
      type: object
      required:
      - fullName
      - email
      - phone
      - password
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
          example: سارة أحمد
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          minLength: 7
          maxLength: 20
          example: '+963912345678'
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
      description: role is NOT accepted. The server always creates public registrations with role=CUSTOMER and isVerified=false.
    AuthResponse:
      type: object
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/User'
    CsrfTokenResponse:
      type: object
      required:
      - csrfToken
      properties:
        csrfToken:
          type: string
          example: csrf-from-session
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: INVALID_STATE
            message:
              type: string
              example: لا يمكن إكمال العملية في الحالة الحالية.
            details:
              $ref: '#/components/schemas/ErrorDetails'
            requestId:
              type: string
              example: req_b43d
    Pagination:
      type: object
      required:
      - page
      - limit
      - total
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: string
          example: '0.42'
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
    Category:
      type: object
      required:
      - id
      - name
      - slug
      - isActive
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: مقابض وأزرار
        slug:
          type: string
          example: knobs-handles
        isActive:
          type: boolean
    CreateCategoryInput:
      type: object
      required:
      - name
      - slug
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 140
        isActive:
          type: boolean
          default: true
    UpdateCategoryInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        isActive:
          type: boolean
    ProductImage:
      type: object
      required:
      - id
      - url
      - sortOrder
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: Public catalog image URL, never raw storage key.
        altText:
          type: string
          nullable: true
        sortOrder:
          type: integer
          minimum: 0
    ProductVariant:
      type: object
      required:
      - id
      - productId
      - sku
      - material
      - color
      - price
      - currency
      - isActive
      - fulfillmentMode
      - stockQuantity
      - isAvailable
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
          example: KNOB-PETG-BLK
        material:
          type: string
          example: PETG
        color:
          type: string
          example: أسود
        currency:
          type: string
          enum:
          - SYP
          example: SYP
        isActive:
          type: boolean
        fulfillmentMode:
          type: string
          enum:
          - IN_STOCK
          - MADE_TO_ORDER
          description: Ready inventory or print-on-demand, configured per variant.
        stockQuantity:
          type: integer
          minimum: 0
          description: Ready stock quantity for IN_STOCK; 0 for MADE_TO_ORDER. No stock reservation on checkout.
        estimatedProductionDays:
          type: integer
          minimum: 1
          nullable: true
          description: Required for MADE_TO_ORDER, null for IN_STOCK.
        isAvailable:
          type: boolean
          description: 'Server-derived: isActive AND product.isActive AND (MADE_TO_ORDER OR stockQuantity > 0).'
        price:
          type: string
          example: '700.00'
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          description: SYP, fixed decimal string (two decimals); server-owned catalog price. Numeric in PostgreSQL.
    Product:
      type: object
      required:
      - id
      - categoryId
      - title
      - description
      - isActive
      - images
      - variants
      - startingPrice
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          example: مقبض غسالة بديل
        description:
          type: string
        isActive:
          type: boolean
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
        startingPrice:
          type: string
          nullable: true
          description: Minimum price of ACTIVE and AVAILABLE variants, computed by backend; not stored in products.
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          example: '150.00'
    CreateProductInput:
      type: object
      required:
      - title
      - description
      additionalProperties: false
      properties:
        categoryId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          minLength: 3
          maxLength: 180
        description:
          type: string
          minLength: 10
    UpdateProductInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        categoryId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          minLength: 3
          maxLength: 180
        description:
          type: string
          minLength: 10
        isActive:
          type: boolean
    CreateVariantInput:
      type: object
      required:
      - sku
      - material
      - color
      - price
      - fulfillmentMode
      additionalProperties: false
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 80
        material:
          type: string
          minLength: 2
          maxLength: 80
        color:
          type: string
          minLength: 2
          maxLength: 60
        isActive:
          type: boolean
          default: true
        fulfillmentMode:
          type: string
          enum:
          - IN_STOCK
          - MADE_TO_ORDER
        stockQuantity:
          type: integer
          minimum: 0
          default: 0
        estimatedProductionDays:
          type: integer
          minimum: 1
          nullable: true
        price:
          type: string
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          example: '150.00'
        unitCost:
          type: string
          nullable: true
          description: Internal estimated cost per unit. ADMIN ONLY.
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          example: '80.00'
      description: 'Fulfillment is configured per variant. IN_STOCK: stockQuantity >= 0 and estimatedProductionDays
        must be omitted/null. MADE_TO_ORDER: stockQuantity must be 0; estimatedProductionDays >= 1. Service validates
        cross-field rules. unitCost is internal, never public.'
    UpdateVariantInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 80
        material:
          type: string
          minLength: 2
          maxLength: 80
        color:
          type: string
          minLength: 2
          maxLength: 60
        isActive:
          type: boolean
        fulfillmentMode:
          type: string
          enum:
          - IN_STOCK
          - MADE_TO_ORDER
        stockQuantity:
          type: integer
          minimum: 0
        estimatedProductionDays:
          type: integer
          minimum: 1
          nullable: true
        price:
          type: string
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          example: '150.00'
        unitCost:
          type: string
          nullable: true
          description: Internal estimated cost per unit. ADMIN ONLY.
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          example: '80.00'
      description: Partial administrative edit. Server enforces fulfillment cross-field constraints after applying
        patch. stockQuantity is an absolute count (not a delta); checkout stock deductions are automatic and atomic.
    Measurements:
      type: object
      description: Optional dimensions in millimeters; unknown values may be omitted. Measurements are not production-ready
        until expert review.
      additionalProperties: false
      properties:
        lengthMm:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 2000
        widthMm:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 2000
        heightMm:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 2000
        thicknessMm:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 2000
        holeDiameterMm:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 2000
        notes:
          type: string
          maxLength: 1000
    RequestAttachment:
      type: object
      required:
      - id
      - fileName
      - mimeType
      - sizeBytes
      - contentUrl
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        mimeType:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
        sizeBytes:
          type: integer
          minimum: 1
        contentUrl:
          type: string
          description: Session-protected API path; browser must send credentials.
    CustomRequest:
      type: object
      required:
      - id
      - customerId
      - type
      - title
      - description
      - quantity
      - status
      - attachments
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - BROKEN_PART
          - FROM_IMAGE
        title:
          type: string
        description:
          type: string
        quantity:
          type: integer
          minimum: 1
        measurements:
          $ref: '#/components/schemas/Measurements'
          nullable: true
        status:
          type: string
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - NEEDS_INFO
          - REJECTED
          - QUOTED
        reviewNote:
          type: string
          nullable: true
          description: Expert request for missing information.
        rejectionReason:
          type: string
          nullable: true
        quoteId:
          type: string
          format: uuid
          nullable: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/RequestAttachment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sourceRequestId:
          type: string
          format: uuid
          nullable: true
          description: Original custom request copied via Reorder. Only allowed if its CUSTOM order is DELIVERED
            or CANCELLED; owner must match.
      description: Custom manufacturing request; no draft. sourceRequestId is optional audit pointer to a previously
        completed/cancelled custom order, not a reused quote.
    CreateCustomMultipart:
      type: object
      required:
      - type
      - title
      - description
      - quantity
      properties:
        type:
          type: string
          enum:
          - BROKEN_PART
          - FROM_IMAGE
        title:
          type: string
          minLength: 3
          maxLength: 180
        description:
          type: string
          minLength: 15
          maxLength: 5000
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        measurementsJson:
          type: string
          description: Optional JSON string conforming to Measurements schema (multipart text field). All dimensions
            in mm.
          example: '{"lengthMm":45,"widthMm":22,"notes":"hole center uncertain"}'
        photos:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            format: binary
          description: For a fresh request supply 1–5 photos. On reorder with sourceRequestId, server copies original
            attachments so new photos are optional; total 1–5. JPEG/PNG/WebP; maximum 10,485,760 bytes each.
        sourceRequestId:
          type: string
          format: uuid
          description: Optional previous custom request to copy photos and prefilling. Must have an associated CUSTOM
            order with status DELIVERED or CANCELLED, belonging to this user.
      description: Create immediately SUBMITTED. Fields title, description, quantity and type are required even
        on reorder (the UI prefills them); there is no DRAFT. Reorder photos may be reused by server only after
        validating ownership and original order status. Source attachments MUST be copied or safely reference-counted;
        never let deleting new attachments corrupt originals.
    ResubmitCustomMultipart:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - SUBMITTED
          description: Atomic resubmission from NEEDS_INFO; only customer owner.
        title:
          type: string
          minLength: 3
          maxLength: 180
        description:
          type: string
          minLength: 15
          maxLength: 5000
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        measurementsJson:
          type: string
          description: Optional JSON string replacing all saved measurements; blank/omitted means unchanged.
        photos:
          type: array
          maxItems: 5
          items:
            type: string
            format: binary
          description: Optional images to append (max 10,485,760 bytes each); 1–5 must remain after removals.
        removeAttachmentIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Repeated multipart fields with the exact key removeAttachmentIds (no brackets and no JSON);
            every value UUID belonging to this request.
      description: Allowed only when NEEDS_INFO; updates fields and images and atomically returns to SUBMITTED.
        No draft; minimum 1 and maximum 5 images retained.
    AdminStartReviewInput:
      type: object
      required:
      - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - UNDER_REVIEW
    AdminNeedsInfoInput:
      type: object
      required:
      - status
      - reviewNote
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - NEEDS_INFO
        reviewNote:
          type: string
          minLength: 5
          maxLength: 2000
    AdminRejectInput:
      type: object
      required:
      - status
      - rejectionReason
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - REJECTED
        rejectionReason:
          type: string
          minLength: 5
          maxLength: 2000
    AdminReviewInput:
      oneOf:
      - $ref: '#/components/schemas/AdminStartReviewInput'
      - $ref: '#/components/schemas/AdminNeedsInfoInput'
      - $ref: '#/components/schemas/AdminRejectInput'
      discriminator:
        propertyName: status
        mapping:
          UNDER_REVIEW: '#/components/schemas/AdminStartReviewInput'
          NEEDS_INFO: '#/components/schemas/AdminNeedsInfoInput'
          REJECTED: '#/components/schemas/AdminRejectInput'
    Quote:
      type: object
      required:
      - id
      - customRequestId
      - preparedByAdminId
      - quantity
      - material
      - unitPrice
      - total
      - currency
      - estimatedProductionDays
      - status
      - expiresAt
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        customRequestId:
          type: string
          format: uuid
        preparedByAdminId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        material:
          type: string
          example: PETG
        currency:
          type: string
          example: SYP
          enum:
          - SYP
          description: 'عملة واحدة: الليرة السورية الجديدة (SYP). المبالغ في أصغر وحدة؛ أسعار كسلاسل عشرية بالليرة
            السورية الجديدة.'
        estimatedProductionDays:
          type: integer
          minimum: 1
          example: 5
          description: Time until custom manufacturing is ready; included in quote.
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - SENT
          - ACCEPTED
          - DECLINED
          - EXPIRED
        expiresAt:
          type: string
          format: date-time
          description: Server assigns expiry exactly 7 days after createdAt; acceptance checks timestamp even if
            status still SENT.
        createdAt:
          type: string
          format: date-time
        unitPrice:
          type: string
          example: '100.00'
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
        total:
          type: string
          example: '300.00'
          description: Quote total before delivery; unitPrice × quantity only; NO shipping and NO separate design
            fee.
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
    CreateQuoteInput:
      type: object
      required:
      - quantity
      - material
      - unitPrice
      - estimatedProductionDays
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        material:
          type: string
          minLength: 2
          maxLength: 100
        estimatedProductionDays:
          type: integer
          minimum: 1
          maximum: 90
        notes:
          type: string
          maxLength: 2000
        unitPrice:
          type: string
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          example: '100.00'
        estimatedCost:
          type: string
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          nullable: true
          example: '170.00'
          description: ADMIN ONLY estimated cost of fulfilling ALL units of the quote.
      description: Server requires quantity to equal approved customRequest.quantity. Quote covers design + manufacturing
        IN unitPrice; no separate design fee or shipping. Currency SYP. Quote amount = quantity × unitPrice. Valid
        for exactly 7 days.
    Address:
      type: object
      required:
      - fullName
      - phone
      - city
      - street
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        phone:
          type: string
          minLength: 5
          maxLength: 30
        city:
          type: string
          minLength: 2
          maxLength: 120
        region:
          type: string
          maxLength: 120
        street:
          type: string
          minLength: 4
          maxLength: 255
        postalCode:
          type: string
          maxLength: 30
        deliveryNotes:
          type: string
          maxLength: 500
    AcceptQuoteInput:
      type: object
      required:
      - status
      - shippingAddress
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ACCEPTED
        shippingAddress:
          $ref: '#/components/schemas/Address'
      description: Customer accepts quote with full shipping address. Quote has no shipping; server adds fixed SYP
        shipping fee when creating PENDING_PAYMENT Order.
    DeclineQuoteInput:
      type: object
      required:
      - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - DECLINED
    QuoteDecisionInput:
      oneOf:
      - $ref: '#/components/schemas/AcceptQuoteInput'
      - $ref: '#/components/schemas/DeclineQuoteInput'
      discriminator:
        propertyName: status
        mapping:
          ACCEPTED: '#/components/schemas/AcceptQuoteInput'
          DECLINED: '#/components/schemas/DeclineQuoteInput'
    QuoteDecisionResponse:
      type: object
      required:
      - quote
      - order
      properties:
        quote:
          $ref: '#/components/schemas/Quote'
        order:
          type: object
          allOf:
          - $ref: '#/components/schemas/Order'
          nullable: true
          description: Order created/reused for ACCEPTED, null for DECLINED.
    OrderItem:
      type: object
      required:
      - id
      - orderId
      - sourceType
      - title
      - quantity
      - unitPrice
      - lineTotal
      - reviewed
      - fulfillmentMode
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        sourceType:
          type: string
          enum:
          - CATALOG
          - CUSTOM
        productVariantId:
          type: string
          format: uuid
          nullable: true
        quoteId:
          type: string
          format: uuid
          nullable: true
        quantity:
          type: integer
          minimum: 1
        reviewed:
          type: boolean
          description: Whether a review has been submitted for this item.
        unitPrice:
          type: string
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          example: '150.00'
        lineTotal:
          type: string
          description: quantity × unitPrice, fixed decimal SYP string. No separate design fee.
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          example: '300.00'
        title:
          type: string
        material:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        fulfillmentMode:
          type: string
          enum:
          - IN_STOCK
          - MADE_TO_ORDER
          description: Mode at order creation. CUSTOM quote items always MADE_TO_ORDER. Immutable after checkout.
        estimatedProductionDays:
          type: integer
          minimum: 1
          nullable: true
          description: Original production lead time for the purchased line; null for IN_STOCK.
      description: Item snapshots at checkout (public aliases title/material/color/fulfillmentMode). Product variant
        ID XOR quote ID. CUSTOM always MADE_TO_ORDER; quote purchased once max.
    Order:
      type: object
      required:
      - id
      - customerId
      - source
      - status
      - items
      - shippingAddress
      - subtotal
      - shippingFee
      - total
      - currency
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        source:
          type: string
          enum:
          - CATALOG
          - CUSTOM
        status:
          type: string
          enum:
          - PENDING_PAYMENT
          - CONFIRMED
          - IN_PROGRESS
          - READY_FOR_DELIVERY
          - SHIPPED
          - DELIVERED
          - CANCELLED
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        shippingAddress:
          $ref: '#/components/schemas/Address'
        currency:
          type: string
          example: SYP
          enum:
          - SYP
          description: 'عملة واحدة: الليرة السورية الجديدة (SYP). المبالغ في أصغر وحدة؛ أسعار كسلاسل عشرية بالليرة
            السورية الجديدة.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        subtotal:
          type: string
          description: Sum of order.items[].lineTotal, exact decimal SYP string.
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
        shippingFee:
          type: string
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          description: Fixed server-configured delivery fee applied ONCE when order is created; customer cannot
            set it.
        total:
          type: string
          description: subtotal + shippingFee. This is the amount for all payment attempts.
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
      description: One order status for all its items; no split shipments. If all IN_STOCK, CONFIRMED can go directly
        to READY_FOR_DELIVERY; otherwise via IN_PROGRESS. No status-history endpoint in v1.3.
    CatalogCheckoutItem:
      type: object
      required:
      - variantId
      - quantity
      additionalProperties: false
      properties:
        variantId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 100
    CreateCatalogOrderInput:
      type: object
      required:
      - items
      - shippingAddress
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/CatalogCheckoutItem'
          description: Each variantId must occur at most once. Enforced by application validation (uniqueItems cannot
            enforce uniqueness by one object property).
        shippingAddress:
          $ref: '#/components/schemas/Address'
      description: Browser cart payload. Duplicate variantIds are rejected with 400 even if uniqueItems (whole-object
        uniqueness) does not detect them. No client prices. IN_STOCK availability is checked here but stock is NOT
        reserved; it is rechecked and deducted atomically on successful mock payment.
    CancelOrderInput:
      type: object
      required:
      - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - CANCELLED
    AdminOrderStatusInput:
      type: object
      required:
      - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - IN_PROGRESS
          - READY_FOR_DELIVERY
          - SHIPPED
          - DELIVERED
    PaymentAttempt:
      type: object
      required:
      - id
      - orderId
      - status
      - amount
      - currency
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - SUCCEEDED
          - FAILED
        currency:
          type: string
          enum:
          - SYP
          example: SYP
          description: 'عملة واحدة: الليرة السورية الجديدة (SYP). المبالغ في أصغر وحدة؛ أسعار كسلاسل عشرية بالليرة
            السورية الجديدة.'
        failureReason:
          type: string
          nullable: true
          description: 'For a simulated failure: SIMULATED_FAILURE. Out-of-stock at payment is reported as HTTP
            409 and does not create an attempt.'
        createdAt:
          type: string
          format: date-time
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          example: '320.00'
          description: Snapshot equal to order.total at attempt time; SYP string.
    MockPaymentInput:
      type: object
      required:
      - testScenario
      additionalProperties: false
      properties:
        testScenario:
          type: string
          enum:
          - SUCCESS
          - FAILURE
          description: Demo-only control. SUCCESS can still return HTTP 409 if inventory is insufficient; no real
            charge.
    PaymentAttemptResult:
      type: object
      required:
      - attempt
      - order
      properties:
        attempt:
          $ref: '#/components/schemas/PaymentAttempt'
        order:
          $ref: '#/components/schemas/Order'
    OrderItemReview:
      type: object
      required:
