        shippingFeeMinor:
          type: integer
          minimum: 0
        totalMinor:
          type: integer
          minimum: 0
          description: subtotalMinor + shippingFeeMinor.
        currency:
          type: string
          example: SYP
          enum:
            - SYP
          description: 'عملة واحدة: الليرة السورية الجديدة (SYP). المبالغ في أصغر وحدة؛ 100 قرش = 1 ليرة.'
        trackingNumber:
          type: string
          nullable: true
        carrier:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CatalogCheckoutItem:
      type: object
      required:
        - variantId
