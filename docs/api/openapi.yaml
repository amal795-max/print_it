components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: 'HttpOnly session cookie named session, as in the teammate Postman examples; MUST confirm actual Set-Cookie
        from running backend. Browser sends cookie with credentials: include.'
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token returned by GET /auth/csrf-token; send on POST, PATCH, DELETE requests (including OTP 
        endpoints). Session cookie must be included.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Random UUID-like key per logical checkout/payment operation. Retry using same key and same body. Scope:
        customer+order creation, or order+payment attempt.'
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    User:
      type: object
      required:
        - id
        - fullName
        - email
        - phone
        - role
        - isVerified
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: سارة أحمد
          description: الاسم الكامل باللغة العربية (محتوى المستخدم كما أدخله).
        email:
          type: string
          format: email
          example: rana@example.com
        phone:
          type: string
          minLength: 7
          maxLength: 20
          example: '+963912345678'
          description: رقم تواصل العميل. يجب التحقق من الصيغة والتطبيع في السيرفر.
        role:
          type: string
          enum:
            - CUSTOMER
            - ADMIN
          readOnly: true
        isVerified:
          type: boolean
          description: هل تم تفعيل البريد عبر OTP؟
        createdAt:
          type: string
          format: date-time
    AuthCredentials:
      type: object
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    RegisterInput:
      type: object
      required:
        - fullName
        - email
        - phone
        - password
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
          example: سارة أحمد
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          minLength: 7
          maxLength: 20
          example: '+963912345678'
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
