openapi: 3.0.3
info:
  title: Print It API
  version: 1.3.0
  description: 'Print It — B2C Arabic-first web MVP. API base remains /api/v1 (this file version is the contract
    revision). Server-side sessions + email OTP (implementation of CSRF, cookie name and resend OTP must be verified
    with Auth teammate). Catalog offers IN_STOCK or MADE_TO_ORDER variants, browser-side cart, server-priced orders,
    atomic stock deduction on successful mock payment. One quote per custom request, valid 7 days; quote includes
    design/manufacturing in a SINGLE unit price and excludes delivery. Fixed delivery fee is added to Order once
    when created; never supplied by client. All customer-facing money is a decimal STRING such as "150.00" denominated
    in SYP (new Syrian pound); PostgreSQL NUMERIC(12,2). No customer-entered money, no order status history, one
    review per Order Item. Custom reorder: a new SUBMITTED custom request may reference sourceRequestId from a DELIVERED
    or CANCELLED custom order; never reuse an old quote. API contract only, not a claim that every route is implemented.
    Breaking change from v1.2 — coordinate before merging.'
  contact:
    name: Print It Backend Team
servers:
- url: http://localhost:3000/api/v1
  description: Local NestJS API, URI versioning
tags:
- name: Auth
- name: Catalog
- name: Custom Requests
- name: Quotes
- name: Orders
- name: Payments
- name: Reviews
- name: Admin - Catalog
- name: Admin - Requests
- name: Admin - Orders
paths:
  /auth/csrf-token:
    get:
      tags:
      - Auth
      summary: Get CSRF token and establish anonymous session
      operationId: getCsrfToken
      description: Obtain CSRF token bound to (possibly anonymous) server session; required before register, verify
        OTP, resend OTP, login, and all other unsafe methods. Fetch again after login/session regeneration.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
  /auth/register:
    post:
      tags:
      - Auth
      summary: Create customer account
      operationId: register
      description: 'Public registration: backend assigns CUSTOMER, creates isVerified=false, sends one-time email
        OTP. Does not create authenticated session. Do not accept role from client. Endpoint URI: /api/v1/auth/register.'
      security: []
      parameters:
      - &id001
        $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: 'Created: unverified customer account; an OTP was issued by the backend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Resource state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/verify-otp:
    post:
      tags:
      - Auth
      summary: Verify email using one-time OTP
      operationId: verifyEmailOtp
      description: 'Matches the teammate Auth contract: code sent at registration. Single-use, expires, rate-limited
        and consumed atomically. Success enables isVerified=true. No session is issued by verification; customer
        logs in afterward. Endpoint URI: /api/v1/auth/verify-otp.'
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpInput'
      responses:
        '200':
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpMessageResponse'
        '400':
          description: Invalid/expired OTP or malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Email already verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Too many attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/resend-otp:
    post:
      tags:
      - Auth
      summary: Resend email activation OTP
      operationId: resendEmailOtp
      description: 'Recommended OTP support endpoint for expired/missing email. Always return generic response even
        for unknown/already verified accounts; apply cooldown and per-email/IP rate limiting. Planned contract:
        Auth owner must implement before frontend depends on it. Endpoint URI: /api/v1/auth/resend-otp.'
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtpInput'
      responses:
        '200':
          description: Generic acknowledgment; do not reveal account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpMessageResponse'
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Authenticate and create session cookie
      operationId: login
      description: Validate email/password, require verified email, then regenerate session ID and set HttpOnly
        SameSite=Lax cookie (Secure in HTTPS). No JWT. CSRF token from anonymous session is invalidated by login;
        frontend fetches a fresh token afterward.
      security: []
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid credentials (without disclosing whether email or password was wrong).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Email not verified (EMAIL_NOT_VERIFIED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Current authenticated user
      operationId: getMe
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: ''
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Destroy current session
      operationId: logout
      description: Destroy server session and clear cookie; frontend must forget cached CSRF token.
      security:
      - sessionCookie: []
      parameters:
      - *id001
      responses:
        '204':
          description: No content
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /categories:
    get:
      tags:
      - Catalog
      summary: List active categories
      operationId: listCategories
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
      description: ''
  /products:
    get:
      tags:
      - Catalog
      summary: List active products with variants
      operationId: listProducts
      security: []
      parameters:
      - &id002
        $ref: '#/components/parameters/Page'
      - &id003
        $ref: '#/components/parameters/Limit'
      - name: categoryId
        in: query
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        schema:
          type: string
          maxLength: 120
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: ''
  /products/{id}:
    get:
      tags:
      - Catalog
      summary: Get published product and variants
      operationId: getProduct
      security: []
      parameters:
      - &id004
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: ''
  /custom-requests:
    post:
      tags:
      - Custom Requests
      summary: Create and submit custom request with photos
      operationId: createCustomRequest
      description: Create SUBMITTED directly (no DRAFT). For normal creation upload 1–5 photos, each <=10,485,760
        bytes. For Reorder, sourceRequestId must point to a custom request from a DELIVERED or CANCELLED CUSTOM
        order owned by the same customer. Server reuses/copies prior photos (1–5 combined), creates a NEW request
        and later a NEW quote. Customer can change title/description/quantity/measurements before submission; old
        quote never reused. Multipart measurementsJson is JSON string.
      security:
      - sessionCookie: []
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCustomMultipart'
            encoding:
              photos:
                style: form
                explode: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRequest'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags:
      - Custom Requests
      summary: List my custom requests
      operationId: listMyCustomRequests
      security:
      - sessionCookie: []
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRequestList'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: ''
  /custom-requests/{id}:
    get:
      tags:
      - Custom Requests
      summary: Get own custom request
      operationId: getMyCustomRequest
      description: Also available to ADMIN under /admin/custom-requests/{id}.
      security:
      - sessionCookie: []
      parameters:
      - *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRequest'
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
      - Custom Requests
      summary: Complete missing information and resubmit
      operationId: resubmitCustomRequest
      description: Owner only, NEEDS_INFO only. Update supplied title, description, quantity, measurementsJson;
        append photos and remove attachments by repeated removeAttachmentIds fields; server keeps 1–5 JPEG/PNG/WebP
        images (max 10,485,760 bytes each) and changes status to SUBMITTED atomically.
      security:
      - sessionCookie: []
      parameters:
      - *id004
      - *id001
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResubmitCustomMultipart'
            encoding:
              photos:
                style: form
                explode: true
              removeAttachmentIds:
                style: form
                explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRequest'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Resource state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /custom-requests/{id}/attachments/{attachmentId}/content:
    get:
      tags:
      - Custom Requests
      summary: View private request photo
      operationId: getCustomAttachmentContent
      description: Returns a protected image stream. Avoid exposing storage keys or unguarded public URLs.
      security:
      - sessionCookie: []
      parameters:
      - *id004
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Image bytes; owner or ADMIN only
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /quotes/{id}:
    get:
      tags:
      - Quotes
      summary: Read my offer/quotation
      operationId: getQuote
      description: Effective status is EXPIRED if a SENT quote passed expiresAt even if a background job has not
        run.
      security:
      - sessionCookie: []
      parameters:
      - *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
      - Quotes
      summary: Accept or decline a quote
      operationId: decideQuote
      description: Only request owner may accept or decline SENT and unexpired quote. ACCEPTED requires shippingAddress,
        creates ONE custom Order with shipping fee added by server at order creation, and an item with quote.unitPrice
        × quantity; no repeat purchase. Idempotent repeated ACCEPTED returns same Order. DECLINED produces no order.
        No city pre-pricing restriction.
      security:
      - sessionCookie: []
      parameters:
      - *id004
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteDecisionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDecisionResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Resource state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /orders:
    post:
      tags:
      - Orders
      summary: Checkout browser cart and create catalog order
      operationId: createCatalogOrder
      description: 'Create a CATALOG order from browser cart: variantId and quantity only. Server applies SYP decimal
        price snapshots and one FIXED shippingFee to the Order; never accept client prices. IN_STOCK check at checkout
        does not reserve stock. Stock atomically deducted only during successful mock payment. Duplicate variant
        IDs or idempotency key mismatch rejected.'
      security:
      - sessionCookie: []
      parameters:
      - *id001
      - &id005
        $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogOrderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Idempotency replay of an already-created order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Insufficient IN_STOCK availability, conflicting idempotency key, or variant not orderable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags:
      - Orders
      summary: List my orders
      operationId: listMyOrders
      security:
      - sessionCookie: []
      parameters:
      - *id002
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: ''
  /orders/{id}:
    get:
      tags:
      - Orders
      summary: Get my order, items, tracking and review flags
      operationId: getMyOrder
      security:
      - sessionCookie: []
      parameters:
      - *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: ''
    patch:
      tags:
      - Orders
      summary: Cancel my unpaid order
      operationId: cancelMyUnpaidOrder
      description: Only owner and only while PENDING_PAYMENT, before any successful payment. No refunds in v1; payment
        and cancellation race must use transaction/row lock.
      security:
      - sessionCookie: []
      parameters:
      - *id004
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Resource state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /orders/{id}/payment-attempts:
    post:
      tags:
      - Payments
      summary: Run immediate mock payment
      operationId: createPaymentAttempt
      description: Synchronous simulated payment. For SUCCESS, lock order and check all IN_STOCK items before atomic
        stock deductions, create single succeeded attempt, and confirm Order in ONE database transaction. If insufficient
        stock, rollback, return 409 OUT_OF_STOCK and do not create attempt. FAILURE creates FAILED attempt and leaves
        Order PENDING_PAYMENT. Idempotency-Key replay never changes stock twice. Customer charged no real money.
        amount equals order.total.
      security:
      - sessionCookie: []
      parameters:
      - *id004
      - *id001
      - *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockPaymentInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttemptResult'
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttemptResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Order status conflict OR stock unavailable at payment (error.code=OUT_OF_STOCK); transaction
            rolls back without a payment attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags:
      - Payments
      summary: List my mock payment attempts
      operationId: listPaymentAttempts
      security:
      - sessionCookie: []
      parameters:
      - *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttemptList'
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: ''
  /order-items/{id}/reviews:
    post:
      tags:
      - Reviews
      summary: Review purchased order item after delivery
      operationId: createOrderItemReview
      description: Exactly one review per order item (UNIQUE order_item_id). Owner only; owning Order must be DELIVERED.
        Applies to catalog and custom items.
      security:
      - sessionCookie: []
      parameters:
      - *id004
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemReview'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Session missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Resource state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /products/{id}/reviews:
    get:
      tags:
      - Reviews
      summary: List item reviews for product
      operationId: getProductReviews
