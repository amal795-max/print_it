      required:
        - id
        - customerId
        - source
        - status
        - items
        - shippingAddress
        - subtotalMinor
        - shippingFeeMinor
        - totalMinor
        - currency
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        source:
          type: string
          enum:
            - CATALOG
            - CUSTOM
