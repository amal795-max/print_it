            - code
            - message
          properties:
            code:
              type: string
              example: INVALID_STATE
            message:
              type: string
              example: لا يمكن إكمال العملية في الحالة الحالية.
            details:
              type: object
              additionalProperties: true
            requestId:
              type: string
              example: req_b43d
    Pagination:
      type: object
      required:
        - page
        - limit
        - total
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          minimum: 0
          example: 42
    Category:
      type: object
      required:
        - id
        - name
        - slug
        - isActive
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: مقابض وأزرار
        slug:
          type: string
          example: knobs-handles
        isActive:
          type: boolean
    CreateCategoryInput:
      type: object
      required:
        - name
        - slug
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 140
        isActive:
          type: boolean
          default: true
    UpdateCategoryInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        isActive:
          type: boolean
    ProductImage:
      type: object
      required:
        - id
        - url
        - sortOrder
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: Public catalog image URL, never raw storage key.
        altText:
          type: string
          nullable: true
        sortOrder:
          type: integer
          minimum: 0
    ProductVariant:
      type: object
      required:
        - id
        - productId
        - sku
        - material
        - color
        - priceMinor
        - currency
        - isActive
        - fulfillmentMode
        - stockQuantity
        - isAvailable
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
          example: KNOB-PETG-BLK
        material:
          type: string
          example: PETG
        color:
          type: string
          example: أسود
        priceMinor:
          type: integer
          minimum: 0
          example: 70000
        currency:
          type: string
          example: SYP
          enum:
            - SYP
          description: 'عملة واحدة: الليرة السورية الجديدة (SYP). المبالغ في أصغر وحدة؛ 100 قرش = 1 ليرة.'
        isActive:
          type: boolean
        fulfillmentMode:
          type: string
          enum:
            - IN_STOCK
            - MADE_TO_ORDER
          description: Ready inventory or print-on-demand, configured per variant.
        stockQuantity:
          type: integer
          minimum: 0
          description: Ready units for IN_STOCK; always 0 for MADE_TO_ORDER. This is not a reservation at checkout.
        estimatedProductionDays:
          type: integer
          minimum: 1
          nullable: true
          description: Required for MADE_TO_ORDER, null for IN_STOCK.
        isAvailable:
          type: boolean
          description: 'Server-derived: isActive AND product.isActive AND (MADE_TO_ORDER OR stockQuantity > 0).'
    Product:
      type: object
      required:
        - id
        - categoryId
        - title
        - description
        - isActive
        - images
        - variants
        - startingPriceMinor
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          example: مقبض غسالة بديل
        description:
          type: string
        isActive:
          type: boolean
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
        startingPriceMinor:
          type: integer
          minimum: 0
          nullable: true
          description: Computed minimum priceMinor among active, available variants; null when none can be ordered. 
            Never stored as product.price.
    CreateProductInput:
      type: object
      required:
        - title
        - description
      additionalProperties: false
      properties:
        categoryId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          minLength: 3
          maxLength: 180
        description:
          type: string
          minLength: 10
    UpdateProductInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        categoryId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          minLength: 3
          maxLength: 180
        description:
          type: string
          minLength: 10
        isActive:
          type: boolean
    CreateVariantInput:
      type: object
      required:
        - sku
        - material
        - color
        - priceMinor
        - fulfillmentMode
      additionalProperties: false
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 80
        material:
          type: string
          minLength: 2
          maxLength: 80
        color:
          type: string
          minLength: 2
          maxLength: 60
        priceMinor:
          type: integer
          minimum: 0
        isActive:
          type: boolean
          default: true
        fulfillmentMode:
          type: string
          enum:
            - IN_STOCK
            - MADE_TO_ORDER
        stockQuantity:
          type: integer
          minimum: 0
          default: 0
        estimatedProductionDays:
          type: integer
          minimum: 1
          nullable: true
        estimatedUnitCostMinor:
          type: integer
          minimum: 0
          nullable: true
          description: Admin-only estimated manufacturing cost per unit; optional and not a sale price.
      description: 'Fulfillment is configured per variant. IN_STOCK: stockQuantity >= 0 and estimatedProductionDays must be
        omitted/null. MADE_TO_ORDER: stockQuantity must be 0; estimatedProductionDays >= 1. Service validates cross-field
        rules. estimatedUnitCostMinor is internal, never public.'
    UpdateVariantInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 80
        material:
          type: string
          minLength: 2
          maxLength: 80
        color:
          type: string
          minLength: 2
          maxLength: 60
        priceMinor:
          type: integer
          minimum: 0
        isActive:
          type: boolean
        fulfillmentMode:
          type: string
          enum:
            - IN_STOCK
            - MADE_TO_ORDER
        stockQuantity:
          type: integer
          minimum: 0
        estimatedProductionDays:
          type: integer
          minimum: 1
          nullable: true
        estimatedUnitCostMinor:
          type: integer
          minimum: 0
          nullable: true
          description: Admin-only estimated manufacturing cost per unit; optional and not a sale price.
      description: Partial administrative edit. Server enforces fulfillment cross-field constraints after applying 
        patch. stockQuantity is an absolute count (not a delta); checkout stock deductions are automatic and atomic.
    Measurements:
      type: object
      description: Optional dimensions in millimeters; unknown values may be omitted. Measurements are not 
        production-ready until expert review.
      additionalProperties: false
      properties:
        lengthMm:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 2000
        widthMm:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 2000
        heightMm:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 2000
        thicknessMm:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 2000
        holeDiameterMm:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 2000
        notes:
          type: string
          maxLength: 1000
    RequestAttachment:
      type: object
      required:
        - id
        - fileName
        - mimeType
        - sizeBytes
        - contentUrl
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        mimeType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
        sizeBytes:
          type: integer
          minimum: 1
        contentUrl:
          type: string
          description: Session-protected API path; browser must send credentials.
    CustomRequest:
      type: object
      required:
        - id
        - customerId
        - type
        - title
        - description
        - quantity
        - usageContext
        - deliveryCity
        - status
        - attachments
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - BROKEN_PART
            - FROM_IMAGE
        title:
          type: string
        description:
          type: string
        quantity:
          type: integer
          minimum: 1
        usageContext:
          type: string
        deviceBrand:
          type: string
          nullable: true
        deviceModel:
          type: string
          nullable: true
        measurements:
          $ref: '#/components/schemas/Measurements'
        deliveryCity:
          type: string
          description: Needed before admin prices shipping in the quote.
        deliveryRegion:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - SUBMITTED
            - UNDER_REVIEW
            - NEEDS_INFO
            - REJECTED
            - QUOTED
        reviewNote:
          type: string
          nullable: true
          description: Expert request for missing information.
        rejectionReason:
          type: string
          nullable: true
        quoteId:
          type: string
          format: uuid
          nullable: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/RequestAttachment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCustomMultipart:
      type: object
      required:
        - type
        - title
        - description
        - quantity
        - usageContext
        - deliveryCity
        - photos
      properties:
        type:
          type: string
          enum:
            - BROKEN_PART
            - FROM_IMAGE
        title:
          type: string
          minLength: 3
          maxLength: 180
        description:
          type: string
          minLength: 15
          maxLength: 5000
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        usageContext:
          type: string
          minLength: 5
          maxLength: 2000
          description: Purpose, installation, exposure to heat/load, and safety concerns.
        deviceBrand:
          type: string
          maxLength: 120
        deviceModel:
          type: string
          maxLength: 120
        deliveryCity:
          type: string
          minLength: 2
          maxLength: 120
        deliveryRegion:
          type: string
          maxLength: 120
        measurementsJson:
          type: string
          description: Optional JSON string conforming to Measurements schema (multipart text field). All dimensions in 
            mm.
          example: '{"lengthMm":45,"widthMm":22,"notes":"hole center uncertain"}'
        photos:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            format: binary
          description: 1–5 JPEG/PNG/WebP images, max 10 MB each.
    ResubmitCustomMultipart:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - SUBMITTED
          description: Atomic resubmission from NEEDS_INFO; only customer owner.
        title:
          type: string
          minLength: 3
          maxLength: 180
        description:
          type: string
          minLength: 15
          maxLength: 5000
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        usageContext:
          type: string
          minLength: 5
          maxLength: 2000
        deviceBrand:
          type: string
          maxLength: 120
        deviceModel:
          type: string
          maxLength: 120
        deliveryCity:
          type: string
          minLength: 2
          maxLength: 120
        deliveryRegion:
          type: string
          maxLength: 120
        measurementsJson:
          type: string
          description: Optional JSON string replacing all saved measurements; blank/omitted means unchanged.
        photos:
          type: array
          maxItems: 5
          items:
            type: string
            format: binary
          description: Images to append; combined retained + new count must be 1–5.
        removeAttachmentIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Existing images to remove atomically during resubmission. Must belong to this request.
    AdminStartReviewInput:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - UNDER_REVIEW
    AdminNeedsInfoInput:
      type: object
      required:
        - status
        - reviewNote
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - NEEDS_INFO
        reviewNote:
          type: string
          minLength: 5
          maxLength: 2000
    AdminRejectInput:
      type: object
      required:
        - status
        - rejectionReason
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - REJECTED
        rejectionReason:
          type: string
          minLength: 5
          maxLength: 2000
    AdminReviewInput:
      oneOf:
        - $ref: '#/components/schemas/AdminStartReviewInput'
        - $ref: '#/components/schemas/AdminNeedsInfoInput'
        - $ref: '#/components/schemas/AdminRejectInput'
      discriminator:
        propertyName: status
        mapping:
          UNDER_REVIEW: '#/components/schemas/AdminStartReviewInput'
          NEEDS_INFO: '#/components/schemas/AdminNeedsInfoInput'
          REJECTED: '#/components/schemas/AdminRejectInput'
    Quote:
      type: object
      required:
        - id
        - customRequestId
        - preparedByAdminId
        - quantity
        - material
        - designFeeMinor
        - unitPriceMinor
        - shippingFeeMinor
        - totalMinor
        - currency
        - estimatedProductionDays
        - status
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        customRequestId:
          type: string
          format: uuid
        preparedByAdminId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        material:
          type: string
          example: PETG
        designFeeMinor:
          type: integer
          minimum: 0
          example: 500
        unitPriceMinor:
          type: integer
          minimum: 0
          example: 700
        shippingFeeMinor:
          type: integer
          minimum: 0
          example: 300
        totalMinor:
          type: integer
          minimum: 0
          example: 2200
          description: Server computes designFeeMinor + unitPriceMinor * quantity + shippingFeeMinor.
        currency:
          type: string
          example: SYP
          enum:
            - SYP
          description: 'عملة واحدة: الليرة السورية الجديدة (SYP). المبالغ في أصغر وحدة؛ 100 قرش = 1 ليرة.'
        estimatedProductionDays:
          type: integer
          minimum: 1
          example: 5
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - SENT
            - ACCEPTED
            - DECLINED
            - EXPIRED
        expiresAt:
          type: string
          format: date-time
          description: Always exactly seven days after issue; server checks at acceptance regardless of stored status.
        createdAt:
          type: string
          format: date-time
    CreateQuoteInput:
      type: object
      required:
        - quantity
        - material
        - designFeeMinor
        - unitPriceMinor
        - shippingFeeMinor
        - estimatedProductionDays
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        material:
          type: string
          minLength: 2
          maxLength: 100
        designFeeMinor:
          type: integer
          minimum: 0
        unitPriceMinor:
          type: integer
          minimum: 0
        shippingFeeMinor:
          type: integer
          minimum: 0
        estimatedProductionDays:
          type: integer
          minimum: 1
          maximum: 90
        notes:
          type: string
          maxLength: 2000
    Address:
      type: object
      required:
        - fullName
        - phone
        - city
        - street
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        phone:
          type: string
          minLength: 5
          maxLength: 30
        city:
          type: string
          minLength: 2
          maxLength: 120
        region:
          type: string
          maxLength: 120
        street:
          type: string
          minLength: 4
          maxLength: 255
        postalCode:
          type: string
          maxLength: 30
        deliveryNotes:
          type: string
          maxLength: 500
    AcceptQuoteInput:
      type: object
      required:
        - status
        - shippingAddress
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ACCEPTED
