    DeclineQuoteInput:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - DECLINED
    QuoteDecisionInput:
      oneOf:
        - $ref: '#/components/schemas/AcceptQuoteInput'
        - $ref: '#/components/schemas/DeclineQuoteInput'
      discriminator:
        propertyName: status
        mapping:
          ACCEPTED: '#/components/schemas/AcceptQuoteInput'
          DECLINED: '#/components/schemas/DeclineQuoteInput'
    QuoteDecisionResponse:
      type: object
      required:
        - quote
        - order
      properties:
        quote:
          $ref: '#/components/schemas/Quote'
        order:
          type: object
          allOf:
            - $ref: '#/components/schemas/Order'
          nullable: true
          description: Order created/reused for ACCEPTED, null for DECLINED.
    OrderItem:
      type: object
      required:
        - id
        - orderId
        - sourceType
        - titleSnapshot
        - quantity
        - unitPriceMinor
        - designFeeMinor
        - lineTotalMinor
        - reviewed
        - fulfillmentModeSnapshot
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        sourceType:
          type: string
          enum:
            - CATALOG
            - CUSTOM
        productVariantId:
          type: string
          format: uuid
          nullable: true
        quoteId:
          type: string
          format: uuid
          nullable: true
        titleSnapshot:
          type: string
        materialSnapshot:
          type: string
          nullable: true
        colorSnapshot:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1
        unitPriceMinor:
          type: integer
          minimum: 0
        designFeeMinor:
          type: integer
          minimum: 0
          description: Zero for catalog; one-time design fee for custom.
        lineTotalMinor:
          type: integer
          minimum: 0
          description: unitPriceMinor * quantity + designFeeMinor.
        reviewed:
          type: boolean
          description: Whether a review has been submitted for this item.
        fulfillmentModeSnapshot:
          type: string
          enum:
            - IN_STOCK
            - MADE_TO_ORDER
