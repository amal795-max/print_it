      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - IN_PROGRESS
            - READY_FOR_DELIVERY
            - SHIPPED
            - DELIVERED
        carrier:
          type: string
          maxLength: 100
          description: Optional when marking SHIPPED.
        trackingNumber:
          type: string
          maxLength: 150
          description: Optional when marking SHIPPED.
