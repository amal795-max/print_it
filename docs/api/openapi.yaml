    AdminProductVariant:
      allOf:
        - $ref: '#/components/schemas/ProductVariant'
        - type: object
          required:
            - estimatedUnitCostMinor
          properties:
            estimatedUnitCostMinor:
              type: integer
              minimum: 0
              nullable: true
              description: Internal estimate, never present in public ProductVariant.
      description: ADMIN ONLY. Public fields plus internal cost estimate.
    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/Product'
