          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreateReviewInput:
      type: object
      required:
      - rating
      additionalProperties: false
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1500
    CategoryList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    ProductList:
      type: object
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CustomRequestList:
      type: object
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomRequest'
        pagination:
          $ref: '#/components/schemas/Pagination'
    OrderList:
      type: object
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          $ref: '#/components/schemas/Pagination'
    PaymentAttemptList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAttempt'
    PublicReview:
      type: object
      required:
      - id
      - rating
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    ReviewList:
      type: object
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicReview'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ProductImageUpload:
      type: object
      required:
      - image
      properties:
        image:
          type: string
          format: binary
        altText:
          type: string
          maxLength: 180
        sortOrder:
          type: integer
          minimum: 0
    VerifyOtpInput:
      type: object
      additionalProperties: false
      required:
      - email
      - otpCode
      properties:
        email:
          type: string
          format: email
        otpCode:
          type: string
          pattern: ^[0-9]{6}$
          example: '482910'
          description: رمز تحقق من 6 أرقام؛ يعامل كنص للحفاظ على الأصفار في البداية.
    ResendOtpInput:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
    OtpMessageResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          example: تم تفعيل الحساب بنجاح.
    AdminProductVariant:
      allOf:
      - $ref: '#/components/schemas/ProductVariant'
      - type: object
        required:
        - unitCost
        properties:
          unitCost:
            type: string
            nullable: true
            description: ADMIN ONLY; internal estimated cost per single variant unit, null if unknown.
            pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
            example: '75.00'
      description: ADMIN ONLY. Public fields plus internal cost estimate.
    AdminProduct:
      allOf:
      - $ref: '#/components/schemas/Product'
      - type: object
        required:
        - variants
        properties:
          variants:
            type: array
            items:
              $ref: '#/components/schemas/AdminProductVariant'
      description: ADMIN ONLY. Same product plus variants with internal costs.
    AdminProductList:
      type: object
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminProduct'
        pagination:
          $ref: '#/components/schemas/Pagination'
    AdminOrderItem:
      allOf:
      - $ref: '#/components/schemas/OrderItem'
      - type: object
        required:
        - estimatedCost
        properties:
          estimatedCost:
            type: string
            pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
            nullable: true
            example: '160.00'
            description: ADMIN ONLY; estimated INTERNAL cost of the entire line (quantity included). Snapshot, not
              charged to customer.
      description: ADMIN ONLY item with estimated cost snapshot.
    AdminOrder:
      allOf:
      - $ref: '#/components/schemas/Order'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/AdminOrderItem'
      description: ADMIN ONLY order view with internal item cost estimates.
    AdminOrderList:
      type: object
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrder'
        pagination:
          $ref: '#/components/schemas/Pagination'
    AdminQuote:
      allOf:
      - $ref: '#/components/schemas/Quote'
      - type: object
        properties:
          estimatedCost:
            type: string
            nullable: true
            pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
            example: '170.00'
            description: ADMIN ONLY. Internal estimate for entire custom request and all units (not per unit).
      description: ADMIN ONLY. Includes optional estimated internal cost for the full quote.
    FieldError:
      type: object
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          example: email
        code:
          type: string
          example: INVALID_FORMAT
        message:
          type: string
          example: البريد الإلكتروني غير صالح.
    ErrorDetails:
      type: object
      description: Validation error details, if applicable. Not all errors have field-level details.
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      additionalProperties: true
x-print-it-business-rules:
  money: 'JSON: fixed two-decimal SYP strings e.g. "150.00"; PostgreSQL NUMERIC(12,2), no floats.'
  shipping: Fixed server-controlled fee added once on Order creation, NOT included in Quote and not supplied by
    client.
  customReorder: New SUBMITTED request from sourceRequestId only when corresponding CUSTOM order DELIVERED or CANCELLED;
    new quote required; source attachments copied safely.
  authImplementationStatus: Session/cookie/CSRF/OTP resend implementation details PENDING confirmation by Auth teammate.
  noOrderHistory: No order_status_history table or GET status-history route in MVP.
  apiVersioning: URI remains /api/v1; document info.version is v1.3 contract revision.
