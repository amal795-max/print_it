<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification code</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td style="color:#111827;font-size:20px;font-weight:700;padding-bottom:12px;">
                Print It verification
              </td>
            </tr>
            <tr>
              <td style="color:#4b5563;font-size:15px;line-height:1.5;padding-bottom:24px;">
                Use this code to verify your email address. It expires in
                <strong>{{expiresInMinutes}} minutes</strong>.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <div style="display:inline-block;letter-spacing:8px;font-size:32px;font-weight:700;color:#111827;background:#f3f4f6;border-radius:8px;padding:12px 20px;">
                  {{otp}}
                </div>
              </td>
            </tr>
            <tr>
              <td style="color:#9ca3af;font-size:13px;line-height:1.5;">
                If you did not create an account, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
